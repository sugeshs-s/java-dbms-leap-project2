# ===================================================================
# Test Configuration (H2 In-Memory Database in MySQL Compatibility Mode)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:ticketdesk_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

logging.level.com.ticketdesk=INFO
